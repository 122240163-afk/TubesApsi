<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 45" width="160" height="45">
  <!-- Toyota Official Emblem -->
  <g transform="translate(4, 3)">
    <!-- Outer Ellipse -->
    <ellipse cx="20" cy="19" rx="19" ry="13.5" fill="none" stroke="#EB0A1E" stroke-width="3"/>
    <!-- Horizontal inner ellipse (crossbar of T) -->
    <ellipse cx="20" cy="14" rx="12" ry="5.5" fill="none" stroke="#EB0A1E" stroke-width="2.6"/>
    <!-- Vertical inner ellipse (stem of T) -->
    <ellipse cx="20" cy="20" rx="5.5" ry="11.5" fill="none" stroke="#EB0A1E" stroke-width="2.6"/>
  </g>
  <!-- Toyota Wordmark -->
  <text x="50" y="29" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" fill="#EB0A1E" letter-spacing="2.5">TOYOTA</text>
</svg>