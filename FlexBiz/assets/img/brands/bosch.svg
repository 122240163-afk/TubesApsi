<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 45" width="160" height="45">
  <!-- Bosch Magneto Armature Emblem -->
  <g transform="translate(6, 6)">
    <circle cx="16" cy="16" r="15" fill="none" stroke="#EA1C24" stroke-width="2.5"/>
    <!-- Magneto poles/armature -->
    <rect x="8" y="7" width="16" height="18" fill="none" stroke="#EA1C24" stroke-width="2"/>
    <line x1="8" y1="16" x2="24" y2="16" stroke="#EA1C24" stroke-width="2"/>
    <circle cx="16" cy="16" r="4" fill="#EA1C24"/>
  </g>
  <!-- Bosch Wordmark -->
  <text x="46" y="28" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#EA1C24" letter-spacing="2">BOSCH</text>
</svg>